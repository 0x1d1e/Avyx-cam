[package]
name = "avyx-cam"
version = "0.1.0"
edition = "2021"
description = "Use your Android phone as a Linux webcam and microphone via scrcpy, v4l2loopback, and PipeWire"

[dependencies]
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_5"] }
mdns-sd = "0.13"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
